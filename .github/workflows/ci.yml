name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Build e testes Java e Go
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Instalar as ferramentas do projeto
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Executar as verificacoes
        run: mise run ci

  publicar:
    name: Publicar imagem ${{ matrix.servico }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - servico: api
            contexto: .
            dockerfile: ./api/adaptadores/src/main/docker/Dockerfile.jvm
          - servico: pagamentos
            contexto: .
            dockerfile: ./services/Dockerfile
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Definir nome da imagem
        id: imagem
        run: echo "nome=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.servico }}" >> "$GITHUB_OUTPUT"

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Entrar no registro de imagens
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.imagem.outputs.nome }}:latest
            ${{ steps.imagem.outputs.nome }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}
