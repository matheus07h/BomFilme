quarkus.http.port=8080

quarkus.datasource.db-kind=postgresql

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

%dev.quarkus.datasource.devservices.image-name=postgres:17-alpine
%test.quarkus.datasource.devservices.image-name=postgres:17-alpine

%prod.quarkus.datasource.jdbc.url=${BOMFILME_DB_URL}
%prod.quarkus.datasource.username=${BOMFILME_DB_USER}
%prod.quarkus.datasource.password=${BOMFILME_DB_PASSWORD}


# API The Movie DataBase
quarkus.rest-client.tmdb-api.url=https://api.themoviedb.org/3
tmdb.auth.token=Bearer ${TMDB_API_TOKEN:}

# Índice Jandex dos módulos de dentro.
#
# O Quarkus descobre beans CDI e introspecta tipos por índice Jandex, e isso é
# automático só no módulo da aplicação. Sem as linhas abaixo, os serviços de
# `aplicacao` não seriam encontrados e os registros de `dominio` ficariam fora do
# registro para reflexão — o build avisava, listando Cinema, Sala, Sessao e Pagina.
#
# Declarar daqui, e não com o plugin Jandex em cada módulo, mantém o pom de `dominio`
# sem nada: a indexação é necessidade de quem usa o framework, não do domínio.
quarkus.index-dependency.dominio.group-id=br.ufrn.bomfilme
quarkus.index-dependency.dominio.artifact-id=dominio
quarkus.index-dependency.aplicacao.group-id=br.ufrn.bomfilme
quarkus.index-dependency.aplicacao.artifact-id=aplicacao
