[tools]
go = "1.27.1"
java = "temurin-25"
buf = "1.75.0"

[tasks.build]
description = "Compila a API Java e o servico Go"
depends = ["gerar-stubs-go"]
run_windows = 'call api\mvnw.cmd -B -f api/pom.xml package -DskipTests && cd services && go build ./...'
run = """
./api/mvnw -B -f api/pom.xml package -DskipTests
cd services && go build ./...
"""

[tasks.test]
description = "Executa os testes da API Java e do servico Go"
depends = ["gerar-stubs-go", "imagem-pagamentos-teste"]
run_windows = 'call api\mvnw.cmd -B -f api/pom.xml -Dapi.version=1.44 test && cd services && go test ./...'
run = """
./api/mvnw -B -f api/pom.xml -Dapi.version=1.44 test
cd services && go test ./...
"""

[tasks.lint]
description = "Valida os contratos e os projetos Java e Go"
depends = ["gerar-stubs-go"]
run_windows = 'buf lint protos && call api\mvnw.cmd -B -f api/pom.xml validate && cd services && go vet ./...'
run = """
buf lint protos
./api/mvnw -B -f api/pom.xml validate
cd services && go vet ./...
"""

[tasks.dev]
description = "Sobe a API em modo de desenvolvimento, com Live Coding"
# O plugin do Quarkus vive no modulo `adaptadores`, nao no agregador, entao
# `quarkus:dev` na raiz de api/ nao resolve o prefixo. Os modulos de dentro vao
# para o repositorio local primeiro, e o dev mode roda de dentro do modulo que
# empacota.
run = """
./api/mvnw -B -f api/pom.xml install -DskipTests -Dquarkus.build.skip=true
cd api/adaptadores && ../mvnw quarkus:dev
"""
run_windows = 'call api\mvnw.cmd -B -f api/pom.xml install -DskipTests -Dquarkus.build.skip=true && cd api\adaptadores && call ..\mvnw.cmd quarkus:dev'

[tasks.up]
description = "Sobe o ambiente local com Docker Compose"
run = "docker compose up --build"

[tasks.down]
description = "Encerra o ambiente local"
run = "docker compose down"

[tasks.ci]
run_windows = 'mise run lint && mise run build && mise run test'
description = "Reproduz localmente as verificacoes do GitHub Actions"
run = """
mise run lint
mise run build
mise run test
"""

[tasks.gerar-stubs-go]
description = "Gera os stubs Go a partir dos contratos gRPC"
run = "buf generate protos --template protos/buf.gen.yaml"

[tasks.imagem-pagamentos-teste]
description = "Constroi a imagem Go usada pelos testes de integracao"
run = "docker build -f services/Dockerfile -t bomfilme/pagamentos:teste ."